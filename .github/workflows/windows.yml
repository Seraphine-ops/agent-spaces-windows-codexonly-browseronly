name: Windows browser beta
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run build:webview2
      - run: npm run test:all
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: agent-spaces-browser-windows-x64
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-test-screenshots
          path: state/ui-review/*.png
          if-no-files-found: ignore
